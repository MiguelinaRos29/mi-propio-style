name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Tests (${{ matrix.servicio }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servicio: [auth, ordenes]
    defaults:
      run:
        working-directory: services/${{ matrix.servicio }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            services/${{ matrix.servicio }}/requirements.txt
            services/requirements-dev.txt
      - name: Instalar dependencias
        run: pip install -r requirements.txt -r ../requirements-dev.txt
      - name: Ejecutar tests
        run: python -m pytest -q

  frontend:
    name: Lint y build (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
